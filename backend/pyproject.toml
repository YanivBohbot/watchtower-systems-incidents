[project]
name = "watchtower-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.146.0", "uvicorn==0.54.0", "sqlalchemy==2.1.5", "psycopg[binary]==3.3.6",
  "python-multipart==0.0.32", "pydantic-settings==2.16.0", "PyJWT==2.15.1",
  "celery==5.6.3", "redis==8.1.0", "qdrant-client==1.19.1", "pypdf==6.21.1",
  "langchain==1.4.6", "langchain-openai==1.7.2", "langgraph==1.2.16",
  "langgraph-checkpoint-sqlite==3.1.2", "langchain-mcp-adapters==0.3.2", "mcp==1.30.0",
  "opencv-python-headless==5.0.0.93", "alembic>=1.16,<2"
]

[project.optional-dependencies]
vision = ["ultralytics==8.4.182", "lap==0.5.13"]
dev = ["pytest==9.1.1", "httpx==0.28.1", "ruff==0.17.1"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
